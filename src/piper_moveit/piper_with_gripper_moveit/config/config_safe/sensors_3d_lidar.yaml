sensors:
  - lidar_sensor

lidar_sensor:
  sensor_plugin: occupancy_map_monitor/PointCloudOctomapUpdater
  point_cloud_topic: /lidar/points
  max_range: 5.0
  point_subsample: 1
  padding_offset: 0.03
  padding_scale: 4.0
  filtered_cloud_topic: filtered_cloud
  max_update_rate: 10.0
  queue_size: 5

