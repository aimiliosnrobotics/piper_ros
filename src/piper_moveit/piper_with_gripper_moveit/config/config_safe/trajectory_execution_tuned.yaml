trajectory_execution:
  # Increased tolerance to handle joint drift and robot settling issues
  allowed_start_tolerance: 0.15  # Increased from 0.05 to handle drift
  execution_duration_monitoring: true
  allowed_goal_duration_margin: 2.0  # Further increased for smoother settling
  # Reduce jerky movements by allowing more time for execution
  allowed_execution_duration_scaling: 2.0  # Further increased for smoother motion
  # Wait for robot to settle before next command
  wait_for_trajectory_completion: true
  # Additional smoothing parameters
  execution_velocity_scaling: 0.8  # Slightly slower execution for smoother motion
  execution_acceleration_scaling: 0.8  # Slightly slower acceleration for smoother motion
